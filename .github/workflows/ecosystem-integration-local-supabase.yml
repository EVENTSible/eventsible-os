name: Ecosystem Integration Local Supabase

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ecosystem-integration-local-supabase.yml"
      - "supabase/**"
      - "scripts/**"
      - "src/contracts/**"
      - "integrations/sql/**"
      - "docs/integrations/**"
      - "docs/README.md"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - codex/hq-data-readiness
      - feat/ecosystem-integration-foundation
      - fix/outbox-helper-grant-parity
      - feat/builder-intake-outbox-wiring
      - fix/builder-outbox-production-quote-lookup
      - fix/builder-outbox-payload-parity
      - fix/builder-event-staff-quote-label
      - fix/builder-event-staff-code-parity
      - feat/builder-submission-email-notifications
      - codex/migration-history-reconciliation
    paths:
      - ".github/workflows/ecosystem-integration-local-supabase.yml"
      - "supabase/**"
      - "scripts/**"
      - "src/contracts/**"
      - "integrations/sql/**"
      - "docs/integrations/**"
      - "docs/README.md"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  local-supabase-verification:
    name: Local Supabase integration verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVENTSIBLE_PRODUCTION_SUPABASE_REF: cplpbzudjprzbnzocirc
      SUPABASE_LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Confirm Docker availability
        run: |
          docker version
          docker run --rm hello-world

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql --version

      - name: Confirm Supabase CLI
        run: npx supabase@2.117.0 --version

      - name: Guard local-only Supabase commands
        run: npm run guard:local-supabase-ci

      - name: Verify canonical migration history
        run: node scripts/verify-migration-history.mjs --canonical-only

      - name: Start local Supabase
        run: |
          set +e
          npx supabase@2.117.0 start > supabase-start.log 2>&1
          start_status=$?
          set -e
          if [ "$start_status" -ne 0 ]; then
            echo "Supabase local startup failed with exit status $start_status."
            node scripts/sanitize-supabase-log.mjs supabase-start.log
            exit "$start_status"
          fi
          grep -E "Started|API URL|Studio URL" supabase-start.log || true

      - name: Confirm local Supabase target
        run: |
          if printf '%s\n' "$SUPABASE_LOCAL_DB_URL" | grep -q "$EVENTSIBLE_PRODUCTION_SUPABASE_REF"; then
            echo "Production Supabase ref appeared in local database URL."
            exit 1
          fi
          pg_isready --dbname "$SUPABASE_LOCAL_DB_URL"
          psql "$SUPABASE_LOCAL_DB_URL" --no-password --tuples-only --command "select current_database(), inet_server_addr(), inet_server_port();" | sed -E 's/[[:space:]]+/ /g'

      - name: Reset and apply local migrations
        run: npx supabase@2.117.0 db reset --local

      - name: Verify reconstructed migration ledger
        run: |
          expected_versions="$(node -e "const m=require('./supabase/migration-history.json'); process.stdout.write(m.migrations.map((x)=>x.version).join('\n'))")"
          actual_versions="$(psql "$SUPABASE_LOCAL_DB_URL" --no-password --tuples-only --no-align --command "select version from supabase_migrations.schema_migrations order by version")"
          test "$actual_versions" = "$expected_versions"

      - name: Lint reconstructed database
        run: npx supabase@2.117.0 db lint --local --schema public,private --level warning --fail-on error

      - name: Export sanitized reconstructed schema catalog
        env:
          SCHEMA_CATALOG_DB_URL: ${{ env.SUPABASE_LOCAL_DB_URL }}
        run: node scripts/export-application-schema-catalog.mjs reconstructed-schema-catalog.json

      - name: Export isolated reconstructed test database
        run: |
          docker exec supabase_db_eventsible-os-local-ci \
            pg_dump --username=postgres --dbname=postgres --format=custom --schema=public --schema=private \
            > reconstructed-test-database.dump

      - name: Preserve sanitized reconstruction evidence
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-schema-evidence
          path: |
            reconstructed-schema-catalog.json
            reconstructed-test-database.dump
          if-no-files-found: error
          retention-days: 7

      - name: Run ecosystem integration verification
        run: npm run test:ecosystem:local-supabase

      - name: Run Team Availability authorization verification
        run: npm run test:team-calendar:local-supabase

      - name: Run Data Readiness authorization and intake verification
        run: npm run test:data-readiness:local-supabase

      - name: Capture local Supabase advisors
        run: |
          mkdir -p artifacts/data-readiness
          npx supabase@2.111.0 db advisors --local --type security --level info --fail-on error --output-format json > artifacts/data-readiness/security-advisors.json
          npx supabase@2.111.0 db advisors --local --type performance --level info --fail-on error --output-format json > artifacts/data-readiness/performance-advisors.json

      - name: Verify Production-shaped Builder quote lookup
        run: npm run test:builder-outbox:production-quote-shape

      - name: Verify Event Staff quote label normalization
        run: npm run test:builder-event-staff-label

      - name: Verify Builder lead notification delivery log
        run: npm run test:builder-lead-notifications

      - name: Verify outbox helper grants
        run: npm run test:outbox-helper-grants

      - name: Run contract tests
        run: npm run test

      - name: Run lint with documented inherited exception
        run: npm run lint:ci

      - name: Configure isolated application environment
        shell: bash
        run: |
          npx supabase@2.111.0 status -o env > /tmp/eventsible-supabase.env
          source /tmp/eventsible-supabase.env
          rm /tmp/eventsible-supabase.env
          test -n "$API_URL"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          printf '::add-mask::%s\n' "$ANON_KEY"
          printf '::add-mask::%s\n' "$SERVICE_ROLE_KEY"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$ANON_KEY" >> "$GITHUB_ENV"
          printf 'LOCAL_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          test_password="$(openssl rand -base64 30 | tr -d '\n')"
          printf '::add-mask::%s\n' "$test_password"
          printf 'DATA_READINESS_TEST_PASSWORD=%s\n' "$test_password" >> "$GITHUB_ENV"
          printf 'DATA_READINESS_APP_URL=http://127.0.0.1:3100\n' >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Install isolated browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated application
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/eventsible-data-readiness-next.log 2>&1 &
          echo "$!" > /tmp/eventsible-data-readiness-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/login > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Isolated application did not become ready."
          exit 1

      - name: Run authenticated Data Readiness browser verification
        run: npm run test:data-readiness:browser

      - name: Upload sanitized Data Readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-readiness-isolated-evidence
          path: artifacts/data-readiness
          if-no-files-found: warn
          retention-days: 14

      - name: Audit
        run: npm audit --audit-level=high

      - name: Stop isolated application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/eventsible-data-readiness-next.pid ]; then
            kill "$(cat /tmp/eventsible-data-readiness-next.pid)" 2>/dev/null || true
          fi

      - name: Stop local Supabase
        if: always()
        run: npx supabase@2.117.0 stop --no-backup

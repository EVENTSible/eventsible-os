name: One-time security lockfile sync
on:
  push:
    branches: [codex/site-studio-owner-draft-preview-20261020]
    paths: [".github/workflows/temporary-security-lock-sync.yml"]
permissions:
  contents: write
jobs:
  sync-reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/site-studio-owner-draft-preview-20261020
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Regenerate reviewed lockfiles without install scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(security): lock reviewed HQ dependency patches"
          git push origin HEAD:refs/heads/codex/site-studio-owner-draft-preview-20261020
